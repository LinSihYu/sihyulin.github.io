         * @returns {string} HTML 字串

        function createCinematicPlaceholder(tone, subtitle) {
            const palettes = {
                'monochrome-warm': { bg1: '#2A2826', bg2: '#161514', accent: '#D6D0C4' },
                'mist-cool':       { bg1: '#25292C', bg2: '#141719', accent: '#C8D0D5' },

                'sepia-soft':      { bg1: '#302A24', bg2: '#191613', accent: '#D8CBB8' }
            };
            const p = palettes[tone] || palettes['noir-contrast'];

            return `
                <div class="w-full h-full relative overflow-hidden flex items-center justify-center transition-transform duration-700 ease-out group-hover:scale-[1.03]"
                     style="background: radial-gradient(circle at 30% 25%, ${p.bg1} 0%, ${p.bg2} 100%);">

                    <svg class="absolute inset-0 w-full h-full opacity-25" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" fill="none">
                        <defs>
                            <linearGradient id="beam-${tone}" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="${p.accent}" stop-opacity="0.35"/>
                                <stop offset="100%" stop-color="${p.accent}" stop-opacity="0"/>
                            </linearGradient>
                        </defs>
                        <polygon points="180,0 780,0 1320,900 520,900" fill="url(#beam-${tone})" />
                        <!-- 電影寬銀幕安全框微線 -->
                        <rect x="64" y="64" width="1472" height="772" stroke="${p.accent}" stroke-opacity="0.22" stroke-width="1"/>
                        <line x1="800" y1="420" x2="800" y2="480" stroke="${p.accent}" stroke-opacity="0.3" stroke-width="1"/>
                        <line x1="770" y1="450" x2="830" y2="450" stroke="${p.accent}" stroke-opacity="0.3" stroke-width="1"/>

        /**
         * SPA 分頁切換函式
         * @param {string} page - 目標分頁鍵值
         * @param {boolean} fromMobile - 是否來自手機版選單
         */
        function navigateTo(page, fromMobile = false) {
            currentPage = page;
            const appContent = document.getElementById('app-content');

            if (page === 'about') {
                appContent.innerHTML = renderAboutPage();
            } else {
                appContent.innerHTML = renderCategoryPage(page);
            }

            updateActiveNavStyles();

            if (fromMobile && isMobileMenuOpen) {
                toggleMobileMenu();
            }

            // 切換頁面時平滑捲回頂部
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        /**
         * 更新桌機與手機導覽列的當前分頁底線樣式
         */
        function updateActiveNavStyles() {
            // 桌機版按鈕
            document.querySelectorAll('.nav-link').forEach(btn => {
                const isActive = btn.dataset.nav === currentPage;
                if (isActive) {
                    btn.classList.add('text-ink', 'after:content-[""]', 'after:absolute', 'after:left-0', 'after:right-0', 'after:bottom-0', 'after:h-[1px]', 'after:bg-ink');
                    btn.classList.remove('text-muted', 'hover:text-ink');
                } else {
                    btn.classList.remove('text-ink', 'after:content-[""]', 'after:absolute', 'after:left-0', 'after:right-0', 'after:bottom-0', 'after:h-[1px]', 'after:bg-ink');
                    btn.classList.add('text-muted', 'hover:text-ink');
                }
            });

            // 手機版按鈕
            document.querySelectorAll('.mobile-nav-link').forEach(btn => {
                const isActive = btn.dataset.mobileNav === currentPage;
                if (isActive) {
                    btn.classList.add('text-ink', 'border-b', 'border-ink');
                    btn.classList.remove('text-muted');
                } else {
                    btn.classList.remove('text-ink', 'border-b', 'border-ink');
                    btn.classList.add('text-muted');
                }
            });
        }

        /**
         * 切換手機版全螢幕選單
         */
        function toggleMobileMenu() {
            isMobileMenuOpen = !isMobileMenuOpen;
            const menu = document.getElementById('mobile-menu');
            const btn = document.getElementById('mobile-menu-btn');
            const line1 = document.getElementById('burger-line-1');
            const line2 = document.getElementById('burger-line-2');
            const line3 = document.getElementById('burger-line-3');

            btn.setAttribute('aria-expanded', String(isMobileMenuOpen));
            menu.setAttribute('aria-hidden', String(!isMobileMenuOpen));

            if (isMobileMenuOpen) {
                menu.classList.remove('opacity-0', 'pointer-events-none');
                menu.classList.add('opacity-100', 'pointer-events-auto');
                document.body.style.overflow = 'hidden';
                // 漢堡圖示轉為極簡 X
                line1.classList.add('translate-y-[7.5px]', 'rotate-45');
                line2.classList.add('opacity-0');
                line3.classList.add('-translate-y-[7.5px]', '-rotate-45');
            } else {
                menu.classList.add('opacity-0', 'pointer-events-none');
                menu.classList.remove('opacity-100', 'pointer-events-auto');
                document.body.style.overflow = '';
                // 還原漢堡圖示
                line1.classList.remove('translate-y-[7.5px]', 'rotate-45');
                line2.classList.remove('opacity-0');
                line3.classList.remove('-translate-y-[7.5px]', '-rotate-45');
            }
        }

        /**
         * 開啟作品燈箱（Lightbox Modal）
         * @param {string} categoryKey - 分類鍵值
         * @param {string} projectId - 作品 ID
         */
        function openModal(categoryKey, projectId) {
            try {
                const category = PORTFOLIO_DATA.categories[categoryKey];
                const project = category?.items.find(item => item.id === projectId);
                if (!project) return;

                const modal = document.getElementById('project-modal');
                const videoContainer = document.getElementById('modal-video-container');

                // 填入標題與基本文字
                document.getElementById('modal-category-label').textContent = category.titleEn;
                document.getElementById('modal-title').textContent = project.title;
                document.getElementById('modal-subtitle').textContent = project.subtitle;
                document.getElementById('modal-year').textContent = project.year;
                document.getElementById('modal-notes').textContent = project.notes;

                // 填入技術資訊欄位
                document.getElementById('modal-meta').innerHTML = `
                    <div>
                        <span class="block font-sans-en text-[10px] tracking-[0.2em] text-muted uppercase mb-1">ROLE</span>
                        <span class="text-ink font-light">${project.role}</span>
                    </div>
                    <div>
                        <span class="block font-sans-en text-[10px] tracking-[0.2em] text-muted uppercase mb-1">${project.creditLabel}</span>
                        <span class="text-ink font-light">${project.creditValue}</span>
                    </div>
                    <div>
                        <span class="block font-sans-en text-[10px] tracking-[0.2em] text-muted uppercase mb-1">DURATION</span>
                        <span class="font-sans-en text-ink font-light">${project.duration}</span>
                    </div>
                    <div>
                        <span class="block font-sans-en text-[10px] tracking-[0.2em] text-muted uppercase mb-1">NOTE / FESTIVAL</span>
                        <span class="text-ink font-light">${project.tag || '—'}</span>
                    </div>
                `;

                // 判斷是否已設定 YouTube / Vimeo 嵌入網址
                if (project.videoUrl && project.videoUrl.trim() !== '') {
                    videoContainer.innerHTML = `
                        <iframe 
                            src="${project.videoUrl}" 
                            title="${project.title}"
                            class="w-full h-full border-0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                            allowfullscreen>
                        </iframe>
                    `;
                } else {
                    // 尚未填入連結時：呈現極簡電影質感模擬播放畫面
                    videoContainer.innerHTML = `
                        <div class="w-full h-full relative flex flex-col items-center justify-center bg-[#121212] text-paper select-none">
                            <!-- 微弱電影寬銀幕裝飾框線 -->
                            <div class="absolute inset-5 sm:inset-8 border border-paper/10 pointer-events-none flex flex-col justify-between p-4">
                                <div class="flex justify-between font-sans-en text-[10px] tracking-[0.22em] text-paper/35 uppercase">
                                    <span>REC • 24FPS</span>
                                    <span>16:9 HD</span>
                                </div>
                                <div class="flex justify-between font-sans-en text-[10px] tracking-[0.22em] text-paper/35">
                                    <span>TC 00:00:00:00</span>
                                    <span>${project.duration}</span>
                                </div>
                            </div>

                            <!-- 模擬播放按鈕 -->
                            <button 
                                type="button"
                                onclick="showToast('範例預覽模式：請於程式碼 PORTFOLIO_DATA 填入 YouTube 或 Vimeo 嵌入連結')"
                                class="relative z-10 group flex flex-col items-center gap-4 focus:outline-none"
                            >
                                <span class="w-16 h-16 sm:w-20 sm:h-20 rounded-full border border-paper/40 flex items-center justify-center group-hover:border-paper group-hover:scale-105 transition-all duration-300 bg-paper/5">
                                    <svg class="w-6 h-6 text-paper ml-1" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M8 5.14v14l11-7-11-7z"/>
                                    </svg>
                                </span>
                                <span class="font-sans-en text-[11px] tracking-[0.24em] text-paper/60 group-hover:text-paper transition-colors uppercase">
                                    Play Preview
                                </span>
                            </button>

                            <p class="absolute bottom-6 sm:bottom-10 text-[11px] text-paper/40 tracking-wider px-6 text-center">
                                可於程式碼 PORTFOLIO_DATA 替換為 YouTube / Vimeo 嵌入網址
                            </p>
                        </div>
                    `;
                }

                // 顯示燈箱並鎖定背景捲動
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                document.body.style.overflow = 'hidden';
            } catch (error) {
                console.error('開啟作品燈箱時發生錯誤:', error);
            }
        }

        /**
         * 關閉作品燈箱並停止影片播放
         */
        function closeModal() {
            const modal = document.getElementById('project-modal');
            const videoContainer = document.getElementById('modal-video-container');

            modal.classList.add('hidden');
            modal.classList.remove('flex');
            // 清空容器以確保 iframe 影片立即停止播放
            videoContainer.innerHTML = '';

            if (!isMobileMenuOpen) {
                document.body.style.overflow = '';
            }
        }

        /**
         * 一鍵複製 Email（使用相容於 iFrame 環境的 execCommand 機制）
         * @param {string} email - 要複製的電子郵件地址
         */
        function copyEmail(email) {
            try {
                const tempInput = document.createElement('textarea');
                tempInput.value = email;
                tempInput.setAttribute('readonly', '');
                tempInput.style.position = 'absolute';
                tempInput.style.left = '-9999px';
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);

                showToast(`已複製 ${email} 至剪貼簿`);
            } catch (err) {
                console.error('複製失敗:', err);
                showToast('複製失敗，請手動選取 Email');
            }
        }

        /**
         * 平滑捲動至「個人資訊」頁面的聯絡方式區塊
         */
        function scrollToContact() {
            const contactEl = document.getElementById('contact-section');
            if (contactEl) {
                contactEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        /**
         * 顯示極簡提示訊息（Toast）
         * @param {string} message - 提示內容
         */
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');

            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 3200);
        }

        // 監聽 ESC 鍵關閉燈箱或手機選單
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                const modal = document.getElementById('project-modal');
                if (!modal.classList.contains('hidden')) {
                    closeModal();
                } else if (isMobileMenuOpen) {
                    toggleMobileMenu();
                }
            }
        });

        // 網頁載入完成後初始化第一頁（個人資訊）
        window.addEventListener('DOMContentLoaded', () => {
            navigateTo('about');
        });
    </script>
</body>
</html>
